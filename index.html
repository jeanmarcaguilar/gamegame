    <title>Jean Marc Aguilar — Full Stack Developer</title>
    <style>
      /* Hide Spline watermark immediately */
      div[class*="spline"] > div:last-child {
        display: none !important;
      }
      a[href*="spline.design"] {
        display: none !important;
      }
      .spline-watermark {
        display: none !important;
      }
      [class*="watermark"] {
        display: none !important;
      }
      [class*="logo"] {
        display: none !important;
      }
      .spline__logo {
        display: none !important;
      }
      .spline-embed-wrapper > div > div:last-child {
        display: none !important;
      }
      [data-spline-logo] {
        display: none !important;
      }
      [class*="spline-logo"] {
        display: none !important;
      }
      .spline-view > div:last-child {
        display: none !important;
      }
    </style>
    <script>
      // Runs synchronously before React mounts to avoid a flash of the
      // wrong theme. Reads saved preference, falls back to OS preference.
      (function () {
        try {
          var saved = localStorage.getItem('jm-theme');
          var theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia &&
                window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          document.documentElement.classList.toggle('dark', theme === 'dark');
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1220' : '#F8FAFC');
        } catch (_) {}
      })();
    </script>
  </head>
  <body class="bg-[var(--color-bg)] text-[var(--color-text)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
